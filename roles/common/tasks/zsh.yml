- name: Install zsh
  become: true
  ansible.builtin.package:
    name:
      - zsh

- name: Register status of oh-my-zsh-directory
  ansible.builtin.stat:
    path: "{{ original_user_home }}/.oh-my-zsh/"
  register: oh_my_zsh_path

- name: Install oh-my-zsh
  when: "not oh_my_zsh_path.stat.exists"
  ansible.builtin.shell: >
    sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"

- name: Install zsh-autosuggestions
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-autosuggestions
    dest: "{{ original_user_home }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"

- name: Install zsh-syntax-highlighting
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    dest: "{{ original_user_home }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"

- name: Install zsh-z
  ansible.builtin.git:
    repo: https://github.com/agkozak/zsh-z.git
    dest: "{{ original_user_home }}/.oh-my-zsh/custom/plugins/zsh-z"

- name: Make zsh the default shell for the original user
  become: true
  ansible.builtin.user:
    name: "{{ original_user }}"
    shell: /usr/bin/zsh
